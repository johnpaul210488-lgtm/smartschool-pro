name: smartschool_driver
description: SmartSchool Pro — Driver app (offline-first pick-in/drop-out + live GPS)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.5+1

  # API + sessions
  http: ^1.6.0
  shared_preferences: ^2.5.6
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  # 7.3.2 pulls dbus ^0.8 which clashes with geolocator's dbus ^0.7 — pin to 7.3.1
  connectivity_plus: 7.3.1

  # GPS + background
  geolocator: ^14.1.1
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^22.3.2

  # Offline outbox
  sqflite: ^2.4.4+2
  path: ^1.9.1

  # UI extras
  google_maps_flutter: ^2.18.2
  cached_network_image: ^4.0.4
  flutter_tts: ^4.2.5

  # In-app self-update (school server → GitHub Release)
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  open_filex: ^5.0.0

  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
