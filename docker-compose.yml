# Optional convenience: a local SQL Server for development.
#   docker compose up -d
# matches the default connection string in appsettings.json.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smartschool-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - smartschool-sql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Your_strong!Passw0rd" -C -Q "SELECT 1" || exit 1
      interval: 10s
      retries: 12
      start_period: 20s

volumes:
  smartschool-sql-data:
