# SQL-only convenience stack for local development (`docker compose up -d`).
# It intentionally does NOT containerize the API or linked-device gateway: the API
# development profile stays on DryRun, while production linked-device deployments use
# the Windows installer so API <-> gateway traffic remains on one loopback-only host.
# The SQL port matches the repository's development connection string.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smartschool-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - smartschool-sql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Your_strong!Passw0rd" -C -Q "SELECT 1" || exit 1
      interval: 10s
      retries: 12
      start_period: 20s

volumes:
  smartschool-sql-data:
