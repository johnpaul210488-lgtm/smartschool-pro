# WPF Admin app CI: compiles on ubuntu (EnableWindowsTargeting) and
# PUBLISHES THE REAL .exe on a Windows runner — download karo aur chalao.
name: SmartSchool Admin (WPF) CI

on:
  push:
    branches: [ main ]
    paths:
      - 'src/SmartSchool.Admin/**'
      - 'SmartSchool.sln'
      - '.github/workflows/admin-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build WPF (compile check)
        run: dotnet build src/SmartSchool.Admin/SmartSchool.Admin.csproj -c Release

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file exe (self-contained)
        run: |
          dotnet publish src/SmartSchool.Admin/SmartSchool.Admin.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish

      - name: Upload exe artifact (SmartSchool-Admin-exe)
        uses: actions/upload-artifact@v4
        with:
          name: SmartSchool-Admin-exe
          path: |
            publish/SmartSchool.Admin.exe
            publish/appsettings.json
          retention-days: 30
