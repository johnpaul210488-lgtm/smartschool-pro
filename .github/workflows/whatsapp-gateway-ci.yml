name: WhatsApp linked-device gateway CI

on:
  push:
    paths:
      - 'src/SmartSchool.WhatsAppGateway/**'
      - '.github/workflows/whatsapp-gateway-ci.yml'
  pull_request:
    paths:
      - 'src/SmartSchool.WhatsAppGateway/**'
      - '.github/workflows/whatsapp-gateway-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/SmartSchool.WhatsAppGateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: src/SmartSchool.WhatsAppGateway/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev
