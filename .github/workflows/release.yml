# Release pipeline: push a tag (v1.1.0) → CI builds EVERYTHING → GitHub Release.
#   git tag v1.1.0 && git push --tags
# School servers then pick the release up via /api/app-updates (WPF + APK auto-update).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v1.1.0)'
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  # ---------------- Admin desktop exe (Windows, self-contained) ----------------
  admin-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - name: Publish admin exe (version = tag)
        shell: pwsh
        run: |
          $v = $env:VERSION.TrimStart('v','V')
          dotnet publish src/SmartSchool.Admin/SmartSchool.Admin.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$v -p:InformationalVersion=$v `
            -o dist/admin

      - uses: actions/upload-artifact@v4
        with:
          name: admin-exe
          path: dist/admin/SmartSchool.Admin.exe

  # ---------------- Driver + Parent APKs (ubuntu + flutter) ----------------
  apks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build driver APK
        run: |
          set -e
          VER="${VERSION#v}"
          cd apps/driver_app
          flutter create --platforms android --org com.smartschool --project-name smartschool_driver .
          # Allow the in-app updater to install downloaded APKs
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|&\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>|' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release --build-name="$VER" --build-number=$((GITHUB_RUN_NUMBER))
          mkdir -p ../../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../../dist/driver-release.apk
        env:
          VERSION: ${{ env.VERSION }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Build parent APK
        run: |
          set -e
          VER="${VERSION#v}"
          cd apps/parent_app
          flutter create --platforms android --org com.smartschool --project-name smartschool_parent .
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|&\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>|' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release --build-name="$VER" --build-number=$((GITHUB_RUN_NUMBER + 1)) || flutter build apk --release --build-name="$VER"
          cp build/app/outputs/flutter-apk/app-release.apk ../../dist/parent-release.apk
        env:
          VERSION: ${{ env.VERSION }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/*.apk

  # ---------------- EF migration bundle (for the one-click installer) ----------------
  efbundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - name: Build efbundle.exe
        run: |
          dotnet tool install -g dotnet-ef
          dotnet ef migrations bundle --self-contained -r win-x64 `
            -p src/SmartSchool.Infrastructure -s src/SmartSchool.API `
            -o dist/efbundle.exe

      - uses: actions/upload-artifact@v4
        with:
          name: efbundle
          path: dist/efbundle.exe

  # ---------------- One-click school-server installer (Inno Setup) ----------------
  installer:
    runs-on: windows-latest
    needs: [admin-exe, efbundle]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - uses: actions/download-artifact@v4
        with:
          name: admin-exe
          path: build-artifacts/admin

      - uses: actions/download-artifact@v4
        with:
          name: efbundle
          path: build-artifacts/db

      - name: Publish API for installer (LocalDB connection + fresh JWT key)
        shell: pwsh
        run: |
          $v = $env:VERSION.TrimStart('v','V')
          dotnet publish src/SmartSchool.API/SmartSchool.API.csproj -c Release -o build-artifacts/api
          Copy-Item installer/appsettings.installer.json build-artifacts/api/appsettings.json -Force
          $key = -join ((48..57)+(65..90)+(97..122) | Get-Random -Count 64 | % {[char]$_})
          (Get-Content build-artifacts/api/appsettings.json) -replace '__JWT_KEY__', $key | Set-Content build-artifacts/api/appsettings.json

      - name: Download SQL Server LocalDB installer
        shell: pwsh
        run: |
          # Official Microsoft SQL Server 2022 LocalDB MSI (~60 MB)
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/7/c/1/7c14e92e-bdcb-4f89-b7cf-93543e7112d1/SqlLocalDB.msi" -OutFile installer/SqlLocalDB.msi

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $v = $env:VERSION.TrimStart('v','V')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$v installer/SchoolServer-Setup.iss
          if (-not (Test-Path dist\installer)) { throw "Installer output missing" }

      - uses: actions/upload-artifact@v4
        with:
          name: installer-exe
          path: dist/installer/*.exe

  # ---------------- GitHub Release with everything attached ----------------
  release:
    runs-on: ubuntu-latest
    needs: [admin-exe, apks, installer]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p dist
          cp "release-files/admin-exe/SmartSchool.Admin.exe" dist/
          cp release-files/apks/*.apk dist/
          cp release-files/installer-exe/*.exe dist/
          gh release create "$VERSION" dist/* \
            --title "SmartSchool Pro $VERSION" \
            --generate-notes \
            --latest
