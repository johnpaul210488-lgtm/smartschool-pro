# Release pipeline: push a tag (v1.1.0) → CI builds EVERYTHING → GitHub Release.
#   git tag v1.1.0 && git push --tags
# School servers then pick the release up via /api/app-updates (WPF + APK auto-update).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v1.1.0)'
        required: true
      preview_only:
        description: 'Build downloadable artifacts without publishing a GitHub Release'
        type: boolean
        default: false
        required: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  # ---------------- Admin desktop exe (Windows, self-contained) ----------------
  admin-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - name: Verify Firebase server setup
        shell: powershell
        run: |
          try { .\tests\windows\test-firebase-setup.ps1 }
          catch {
            $message = "$($_.Exception.Message)`n$($_.ScriptStackTrace)".Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Firebase setup test failed::$message"
            exit 1
          }

      - name: Publish admin exe (version = tag)
        shell: pwsh
        run: |
          $v = $env:RELEASE_TAG.TrimStart('v','V')
          dotnet publish src/SmartSchool.Admin/SmartSchool.Admin.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$v -p:InformationalVersion=$v `
            -o dist/admin

      - uses: actions/upload-artifact@v4
        with:
          name: admin-exe
          path: dist/admin/SmartSchool.Admin.exe

  # ---------------- Driver + Parent APKs (ubuntu + flutter) ----------------
  apks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build driver APK
        run: |
          set -e
          VER="${RELEASE_TAG#v}"
          cd apps/driver_app
          flutter create --platforms android --org com.smartschool --project-name smartschool_driver .
          python3 ../../tools/ci/firebase_setup.py android firebase/google-services.json
          # flutter_local_notifications release builds need core library desugaring
          G=android/app/build.gradle.kts; [ -f "$G" ] || G=android/app/build.gradle
          printf '\nandroid { compileOptions { isCoreLibraryDesugaringEnabled = true } }\ndependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4") }\n' >> "$G"
          flutter pub get
          flutter build apk --release --build-name="$VER" --build-number=$((GITHUB_RUN_NUMBER))
          mkdir -p ../../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../../dist/driver-release.apk
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Build parent APK
        env:
          PARENT_GOOGLE_SERVICES_JSON: ${{ secrets.PARENT_GOOGLE_SERVICES_JSON }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e
          VER="${RELEASE_TAG#v}"
          cd apps/parent_app
          flutter create --platforms android --org com.smartschool --project-name smartschool_parent .
          # The checked-in client config is already public in existing APKs.
          # The optional override must also be Android config, NEVER a service-account key.
          if [ -n "$PARENT_GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$PARENT_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ -f firebase/google-services.json ]; then
            cp firebase/google-services.json android/app/google-services.json
          else
            echo '::error::Parent Firebase Android app config is missing.'
            exit 1
          fi
          python3 ../../scripts/configure_parent_android.py . --expected-project queen-school
          sed -i 's|android:label="[^"]*"|android:label="Queen International School"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|&\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>|' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release --build-name="$VER" --build-number=$((GITHUB_RUN_NUMBER + 1))
          cp build/app/outputs/flutter-apk/app-release.apk ../../dist/parent-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/*.apk

  # ---------------- EF migration bundle (for the one-click installer) ----------------
  efbundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - name: Build efbundle.exe
        run: |
          dotnet tool install -g dotnet-ef
          dotnet restore src/SmartSchool.API/SmartSchool.API.csproj -r win-x64
          dotnet ef migrations bundle --self-contained -r win-x64 `
            -p src/SmartSchool.Infrastructure -s src/SmartSchool.API `
            -o dist/efbundle.exe

      - uses: actions/upload-artifact@v4
        with:
          name: efbundle
          path: dist/efbundle.exe

  # ---------------- One-click school-server installer (Inno Setup) ----------------
  installer:
    runs-on: windows-latest
    # Never publish an installer unless the complete EF migration graph compiled.
    needs: [admin-exe, efbundle]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: src/SmartSchool.WhatsAppGateway/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: admin-exe
          path: build-artifacts/admin

      - name: Publish API for installer (LocalDB connection + fresh JWT key)
        shell: pwsh
        run: |
          $v = $env:RELEASE_TAG.TrimStart('v','V')
          # CHANGED: stamp the API binaries so the installed server version is verifiable.
          dotnet publish src/SmartSchool.API/SmartSchool.API.csproj -c Release -r win-x64 --self-contained true `
            -p:Version=$v -p:InformationalVersion=$v -o build-artifacts/api
          Copy-Item installer/appsettings.installer.json build-artifacts/api/appsettings.json -Force
          # Leave the placeholder for the installer to replace locally on each fresh install.
          # An upgrade preserves its existing config/key byte-for-byte.

      - name: Test and stage portable linked-device gateway
        shell: pwsh
        run: |
          Push-Location src/SmartSchool.WhatsAppGateway
          npm ci --omit=dev
          npm run check
          npm test
          npm audit --omit=dev
          Pop-Location
          $dest = "build-artifacts/whatsapp-gateway"
          New-Item -ItemType Directory -Force "$dest/src" | Out-Null
          Copy-Item src/SmartSchool.WhatsAppGateway/src/* "$dest/src" -Recurse -Force
          Copy-Item src/SmartSchool.WhatsAppGateway/package.json,src/SmartSchool.WhatsAppGateway/package-lock.json,src/SmartSchool.WhatsAppGateway/NODE-LICENSE $dest -Force
          Copy-Item src/SmartSchool.WhatsAppGateway/node_modules "$dest/node_modules" -Recurse -Force
          # Product-specific filename allows the installer/supervisor to stop only its own runtime.
          Copy-Item (Get-Command node).Source "$dest/SmartSchool.WhatsAppGateway.exe" -Force

      - name: Download SQL Server LocalDB installer (2022) + VERIFY it is a real MSI
        shell: pwsh
        run: |
          # Official Microsoft SQL Server 2022 (16.x) LocalDB MSI
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/3/8/d/38de7036-2433-4207-8eae-06e247e17b25/SqlLocalDB.msi" -OutFile installer/SqlLocalDB.msi
          $f = Get-Item installer/SqlLocalDB.msi
          if ($f.Length -lt 40MB) { throw "SqlLocalDB.msi too small ($($f.Length/1MB) MB) — download bad!" }
          $bytes = [System.IO.File]::ReadAllBytes($f.FullName)[0..3]
          if (-not ($bytes[0] -eq 0xD0 -and $bytes[1] -eq 0xCF -and $bytes[2] -eq 0x11 -and $bytes[3] -eq 0xE0)) {
            throw "SqlLocalDB.msi is NOT a real MSI (magic bytes mismatch — HTML error page downloaded?)"
          }
          Write-Host "SqlLocalDB.msi OK: $([math]::Round($f.Length/1MB,1)) MB, valid MSI signature"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $v = $env:RELEASE_TAG.TrimStart('v','V')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$v installer/SchoolServer-Setup.iss
          if (-not (Test-Path dist\installer)) { throw "Installer output missing" }

      - uses: actions/upload-artifact@v4
        with:
          name: installer-exe
          path: dist/installer/*.exe

  # ---------------- GitHub Release with everything attached ----------------
  release:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.preview_only }}
    runs-on: ubuntu-latest
    needs: [admin-exe, apks, installer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p dist
          cp "release-files/admin-exe/SmartSchool.Admin.exe" dist/
          cp release-files/apks/*.apk dist/
          cp release-files/installer-exe/*.exe dist/
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Queen International School $RELEASE_TAG" \
            --generate-notes \
            --latest
