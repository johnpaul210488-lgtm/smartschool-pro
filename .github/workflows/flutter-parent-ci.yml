# Flutter Parent app CI: pub get + analyze on every push to the app.
name: Parent App (Flutter) CI

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/parent_app/**'
      - 'scripts/configure_parent_android.py'
      - 'tests/test_configure_parent_android.py'
      - '.github/workflows/flutter-parent-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/parent_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter doctor
        run: flutter doctor -v

      - name: pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Push registration tests
        run: flutter test

      - name: Android Firebase configuration tests
        working-directory: .
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
