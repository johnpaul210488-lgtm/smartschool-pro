# Branch verification: builds every project, validates the EF migration graph and
# runs the fee-plan / partial-payment smoke test against a real SQL Server 2022.
# Runs on any non-main branch so work can be proven green before merging to main.
name: Verify branch

on:
  push:
    branches-ignore: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build + EF migration check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SmartSchool.sln

      - name: Build (Release, warnings as errors off)
        run: dotnet build SmartSchool.sln --configuration Release --no-restore

      - name: EF Core migrations script must generate
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.*
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations script --idempotent \
            --project src/SmartSchool.Infrastructure \
            --startup-project src/SmartSchool.API \
            --output /tmp/ef-check.sql
          echo "---- generated migration statements ----"
          grep -c "CREATE TABLE\|ALTER TABLE\|CREATE INDEX" /tmp/ef-check.sql || true
          if grep -q "FeePayments" /tmp/ef-check.sql; then echo "FeePayments migration present"; else echo "FeePayments migration MISSING"; exit 1; fi

  api-smoke:
    name: API smoke test (SQL Server 2022)
    runs-on: ubuntu-latest
    needs: build
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Your_strong!Passw0rd'
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_strong!Passw0rd' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Your_strong!Passw0rd' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish API
        run: dotnet publish src/SmartSchool.API/SmartSchool.API.csproj -c Release -o /tmp/api

      - name: Start API (migrations apply on startup)
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5000
          ConnectionStrings__DefaultConnection: 'Server=127.0.0.1,1433;Database=SmartSchoolPro;User Id=sa;Password=Your_strong!Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true'
          Jwt__Key: 'ci-only-key-0123456789abcdef-0123456789abcdef'
          SeedDemoData: 'false'
        run: |
          cd /tmp/api
          nohup dotnet SmartSchool.API.dll --urls http://127.0.0.1:5000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sS -o /dev/null http://127.0.0.1:5000/health; then echo "API up after ${i}0s-ish"; break; fi
            sleep 2
          done
          curl -sS http://127.0.0.1:5000/health || (tail -n 100 /tmp/api.log && exit 1)

      - name: Fee plan + partial payment smoke test
        run: bash scripts/fees-api-smoke-test.sh

      - name: API log on failure (as annotation)
        if: failure()
        run: |
          python3 -c "import io;log=open('/tmp/api.log',errors='replace').read()[-3000:];print('::error title=API log tail::'+log.replace(chr(13),'').replace(chr(10),'%0A'))" || true
          tail -n 200 /tmp/api.log || true

  upgrade-path:
    name: Upgrade path (legacy DB -> new schema)
    runs-on: ubuntu-latest
    needs: build
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Your_strong!Passw0rd'
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_strong!Passw0rd' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Your_strong!Passw0rd' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.*
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Create the PREVIOUS (pre-automation) schema
        run: |
          dotnet ef database update 20261024165714_FeePlanFoundation \
            --project src/SmartSchool.Infrastructure \
            --startup-project src/SmartSchool.API \
            --connection "Server=127.0.0.1,1433;Database=SmartSchoolPro;User Id=sa;Password=Your_strong!Passw0rd;TrustServerCertificate=True"

      - name: Insert legacy finance data (one Paid + one Partial fee)
        run: bash scripts/ci/insert-legacy-fixture.sh

      - name: Upgrade to the new schema (must not block on legacy Partial rows)
        run: |
          dotnet ef database update \
            --project src/SmartSchool.Infrastructure \
            --startup-project src/SmartSchool.API \
            --connection "Server=127.0.0.1,1433;Database=SmartSchoolPro;User Id=sa;Password=Your_strong!Passw0rd;TrustServerCertificate=True"

      - name: Publish + start API
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5000
          ConnectionStrings__DefaultConnection: 'Server=127.0.0.1,1433;Database=SmartSchoolPro;User Id=sa;Password=Your_strong!Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true'
          Jwt__Key: 'ci-only-key-0123456789abcdef-0123456789abcdef'
          SeedDemoData: 'false'
        run: |
          dotnet publish src/SmartSchool.API/SmartSchool.API.csproj -c Release -o /tmp/api-upgrade
          cd /tmp/api-upgrade
          nohup dotnet SmartSchool.API.dll --urls http://127.0.0.1:5000 > /tmp/api-upgrade.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sS -o /dev/null http://127.0.0.1:5000/health; then break; fi
            sleep 2
          done
          curl -sS http://127.0.0.1:5000/health

      - name: Legacy data integrity checks
        run: bash scripts/ci/legacy-upgrade-check.sh

      - name: API log on failure (as annotation)
        if: failure()
        run: |
          python3 -c "log=open('/tmp/api-upgrade.log',errors='replace').read()[-3000:];print('::error title=Upgrade API log tail::'+log.replace(chr(13),'').replace(chr(10),'%0A'))" || true
          tail -n 200 /tmp/api-upgrade.log || true

  flutter-parent:
    name: Parent app analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: pub get + analyze
        working-directory: apps/parent_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos

  flutter-driver:
    name: Driver app analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: pub get + analyze
        working-directory: apps/driver_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test # <-- CHANGED

  driver-android-gps: # <-- CHANGED
    name: Driver Android GPS startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4 # <-- CHANGED
      - name: Prepare driver Android app
        working-directory: apps/driver_app
        run: |
          flutter create --platforms android --org com.smartschool --project-name smartschool_driver .
          G=android/app/build.gradle.kts; [ -f "$G" ] || G=android/app/build.gradle
          printf '\nandroid { compileOptions { isCoreLibraryDesugaringEnabled = true } }\ndependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4") }\n' >> "$G"
          flutter pub get
          flutter build apk --debug --target integration_test/background_gps_test.dart # <-- CHANGED
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test background service on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            echo '::notice::Android GPS test script started' # <-- CHANGED
            result=$(adb install -r apps/driver_app/build/app/outputs/flutter-apk/app-debug.apk 2>&1) || { echo "::error::Android APK installation failed: $(printf '%s' "$result" | tr '\n' ' ')"; exit 1; } # <-- CHANGED
            adb shell pm grant com.smartschool.smartschool_driver android.permission.ACCESS_FINE_LOCATION || { echo '::error::Fine location grant failed'; exit 1; }
            adb shell pm grant com.smartschool.smartschool_driver android.permission.ACCESS_COARSE_LOCATION || { echo '::error::Coarse location grant failed'; exit 1; }
            adb shell pm grant com.smartschool.smartschool_driver android.permission.POST_NOTIFICATIONS || { echo '::error::Notification grant failed'; exit 1; }
            cd apps/driver_app && timeout 300s flutter drive --driver test_driver/integration_test.dart --target integration_test/background_gps_test.dart --use-application-binary build/app/outputs/flutter-apk/app-debug.apk > gps-test.log 2>&1 || { adb logcat -d -v brief > gps-device.log; cat gps-test.log; python3 -c "from pathlib import Path; import re; lines=Path('gps-device.log').read_text(errors='replace').splitlines(); d='\n'.join(x for x in lines if re.search('GPS_DIAG|BackgroundService|flutter|dart|exception|error',x,re.I) and not re.search('TestWidgets|testWidgets|Test failed|FRAMEWORK|stack trace|widget_tester',x)); s=Path('gps-test.log').read_text()[-1200:]+'\nDEVICE LOG:\n'+d[:12000]; print('::error title=Android GPS test::'+s.replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A'))"; exit 1; } # <-- CHANGED
            cat apps/driver_app/gps-test.log # <-- CHANGED

  admin-exe:
    name: Admin exe (Windows, downloadable)
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish single-file exe
        run: |
          dotnet publish src/SmartSchool.Admin/SmartSchool.Admin.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: SmartSchool-Admin-exe
          path: |
            publish/SmartSchool.Admin.exe
            publish/appsettings.json
          retention-days: 14
